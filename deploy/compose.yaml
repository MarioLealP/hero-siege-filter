# One container: builds the SPA, serves the SPA + /api on :8000.
# Stateless — the research catalog is baked into the image, no volumes, no secrets.
name: hero-siege-filter

services:
  hero-siege-filter:
    build:
      context: ..
      dockerfile: app/Dockerfile
    image: hero-siege-filter:latest
    container_name: hero-siege-filter
    restart: unless-stopped
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
